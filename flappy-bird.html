<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flappy Bird</title>
<style>
  :root {
    --page: #7bc5cd;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #14202b; } }
  :root[data-theme="dark"] { --page: #14202b; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  #wrap { position: relative; --u: 4px; }
  :root { --ink: #543847; --card: #ded895; --orange: #e86101; --sea: #7bc5cd; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink: #f1e8b8; --card: #2b3644; --sea: #1d3a4a; } }
  :root[data-theme="dark"] { --ink: #f1e8b8; --card: #2b3644; --sea: #1d3a4a; }
  #gear { position: absolute; top: calc(2.5 * var(--u)); right: calc(2.5 * var(--u)); width: calc(11 * var(--u)); height: calc(11 * var(--u)); padding: calc(1.6 * var(--u)); box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: var(--orange); color: #fff; border: calc(0.8 * var(--u)) solid #543847; border-radius: calc(2 * var(--u)); cursor: pointer; }
  #gear svg { width: 100%; height: 100%; }
  #settings { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(10, 20, 30, .6); font-family: "Courier New", ui-monospace, monospace; font-weight: bold; }
  #settings.open { display: flex; }
  #settings .card { width: min(84%, calc(84 * var(--u))); box-sizing: border-box; padding: calc(5 * var(--u)); background: var(--card); color: var(--ink); border: calc(1 * var(--u)) solid var(--ink); border-radius: calc(2.5 * var(--u)); text-align: center; }
  #settings h2 { margin: 0 0 calc(3 * var(--u)); font-size: calc(7 * var(--u)); letter-spacing: calc(.5 * var(--u)); }
  #settings p { margin: 0 0 calc(3 * var(--u)); font-size: calc(4.5 * var(--u)); }
  #swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(3 * var(--u)); }
  .sw { font: inherit; font-size: calc(3.6 * var(--u)); color: var(--ink); background: var(--sea); border: calc(0.8 * var(--u)) solid var(--ink); border-radius: calc(1.5 * var(--u)); padding: calc(2 * var(--u)) calc(1 * var(--u)) calc(1.2 * var(--u)); cursor: pointer; }
  .sw canvas { width: 70%; height: auto; aspect-ratio: 17 / 12; display: block; margin: 0 auto calc(1.2 * var(--u)); image-rendering: pixelated; }
  .sw.sel { border-color: var(--orange); box-shadow: 0 0 0 calc(1 * var(--u)) var(--orange); }
  #settings p.gap { margin-top: calc(4 * var(--u)); }
  #times { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(3 * var(--u)); }
  .tm { font: inherit; font-size: calc(4 * var(--u)); padding: calc(1.4 * var(--u)) calc(1 * var(--u)); color: var(--ink); background: var(--sea); border: calc(0.8 * var(--u)) solid var(--ink); border-radius: calc(1.5 * var(--u)); cursor: pointer; }
  .tm.sel { border-color: var(--orange); box-shadow: 0 0 0 calc(1 * var(--u)) var(--orange); }
  #slider { display: block; width: 100%; height: auto; margin-top: calc(3 * var(--u)); image-rendering: pixelated; touch-action: none; cursor: pointer; }
  #toggles { display: grid; grid-template-columns: 1fr 1fr; gap: calc(3 * var(--u)); margin-top: calc(4 * var(--u)); }
  #music, #sfx { font: inherit; font-size: calc(4.5 * var(--u)); width: 100%; padding: calc(1.4 * var(--u)) calc(2 * var(--u)); color: var(--ink); background: var(--sea); border: calc(0.8 * var(--u)) solid var(--ink); border-radius: calc(1.5 * var(--u)); cursor: pointer; }
  #music.on, #sfx.on { background: var(--orange); color: #fff; }
  #done { margin-top: calc(5 * var(--u)); width: 100%; font: inherit; font-size: calc(5 * var(--u)); padding: calc(2.4 * var(--u)) 0; color: #fff; background: var(--orange); border: calc(0.9 * var(--u)) solid #543847; border-radius: calc(2 * var(--u)); cursor: pointer; }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="144" height="256" aria-label="Flappy Bird game. Press space or tap to flap."></canvas>
  <button id="gear" type="button" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="5.5"/><circle cx="12" cy="12" r="9" stroke-dasharray="3.5 3.57"/></svg></button>
  <div id="settings" role="dialog" aria-modal="true" aria-label="Settings">
    <div class="card">
      <h2>SETTINGS</h2>
      <p>Bird colour</p>
      <div id="swatches" role="radiogroup" aria-label="Bird colour"></div>
      <p class="gap">Time of day</p>
      <div id="times" role="radiogroup" aria-label="Time of day"></div>
      <canvas id="slider" width="104" height="28" tabindex="0" role="slider" aria-label="Time of day" aria-valuemin="0" aria-valuemax="24" aria-valuenow="12"></canvas>
      <div id="toggles">
        <div><p>Music (M)</p><button id="music" type="button" aria-pressed="true">ON</button></div>
        <div><p>Sound</p><button id="sfx" type="button" aria-pressed="true">ON</button></div>
      </div>
      <button id="done" type="button">DONE</button>
    </div>
  </div>
</div>

  }

  // warm dusk / dawn bands over the sky, stepped like pixel art
  function drawGlow() {
    for (var k = 0; k < 10; k++) {
      ctx.fillStyle = 'rgba(255,140,90,' + (0.5 * glow * (k + 1) / 10).toFixed(3) + ')';
      ctx.fillRect(0, 40 + k * 16, W, 16);
    }
  }

  // ---- time slider: drawn at game pixel scale with the game's own sprites ----
  var sl = document.getElementById('slider'), sg = sl.getContext('2d');
  var TX0 = 9, TX1 = 95, dragging = false, lastHr = -1;
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function hhmm(h) { var m = Math.round(h * 60) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
  function skyRGB(h) {  // the same sky colours the scene uses, for the track
    var n = nightAt(h), w = glowAt(h) * 0.65;
    var r = 123 + (24 - 123) * n, g = 197 + (42 - 197) * n, b = 205 + (86 - 205) * n;
    r += (250 - r) * w; g += (150 - g) * w; b += (90 - b) * w;
    return 'rgb(' + Math.round(r) + ',' + Math.round(g) + ',' + Math.round(b) + ')';
  }
  function drawSlider() {
    if (!strips.length) return;
    var CREAM = '#eafddb', DARK = '#523747', i;
    sg.imageSmoothingEnabled = false;
    sg.clearRect(0, 0, 104, 28);
    // clock readout in the score digits
    var s = hhmm(hour), items = [], w = -1;
    for (i = 0; i < s.length; i++) {
      if (s.charAt(i) === ':') items.push({ w: 4, colon: true });
      else { var r = BIG[+s.charAt(i)]; items.push({ w: r[2], r: r }); }
    }
    items.forEach(function (it) { w += it.w + 1; });
    var x = Math.round((104 - w) / 2);
    items.forEach(function (it) {
      if (it.colon) {
        sg.fillStyle = DARK; sg.fillRect(x, 2, 4, 8);
        sg.fillStyle = '#fff'; sg.fillRect(x + 1, 3, 2, 2); sg.fillRect(x + 1, 7, 2, 2);
      } else sg.drawImage(SHEET, it.r[0], it.r[1], it.r[2], it.r[3], x, 0, it.w, it.r[3]);
      x += it.w + 1;
    });
    // track: cream glow, dark outline, sky fill (midnight at both ends, noon in the middle)
    sg.fillStyle = CREAM; sg.fillRect(4, 13, 97, 11);
    sg.fillStyle = DARK; sg.fillRect(5, 14, 95, 9);
    for (var px = 6; px <= 98; px++) {
      sg.fillStyle = skyRGB(Math.max(0, Math.min(24, (px - TX0) / (TX1 - TX0) * 24)));
      sg.fillRect(px, 15, 1, 7);
    }
    sg.fillStyle = 'rgba(255,255,255,0.3)'; sg.fillRect(6, 15, 93, 1);
    sg.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || DARK;
    [0, 6, 12, 18, 24].forEach(function (hh) { sg.fillRect(Math.round(TX0 + (TX1 - TX0) * hh / 24), 25, 1, 2); });
    // the bird is the handle, and flaps as it moves
    var tx = Math.round(TX0 + (TX1 - TX0) * Math.max(0, Math.min(24, hour)) / 24);
    var f = [0, 1, 2, 1][Math.floor(hour * 3) % 4];
    sg.drawImage(strips[colour], f * 17, 0, 17, 12, tx - 8, 12, 17, 12);
    sl.setAttribute('aria-valuenow', String(Math.round(hour * 10) / 10));
    sl.setAttribute('aria-valuetext', hhmm(hour));
  }
  function hourFromEvent(e) {
    var r = sl.getBoundingClientRect();
    return Math.max(0, Math.min(24, ((e.clientX - r.left) / r.width * 104 - TX0) / (TX1 - TX0) * 24));
  }
  function setCustom(h) {
    h = Math.round(h * 4) / 4;  // snaps to 15 minutes
    if (timeMode !== 'custom') {
      timeMode = 'custom';
      try { localStorage.setItem('flappy-time', 'custom'); } catch (e) {}
      buildTimes();
    }
    customHour = h;
    try { localStorage.setItem('flappy-hour', String(h)); } catch (e) {}
    hour = hourTarget = h; mix = nightAt(h); glow = glowAt(h);
    setPageColour();
    if (Math.floor(h) !== lastHr) { lastHr = Math.floor(h); sfx('click'); }
    drawSlider();
  }
  sl.addEventListener('pointerdown', function (e) { dragging = true; sl.setPointerCapture(e.pointerId); setCustom(hourFromEvent(e)); });
  sl.addEventListener('pointermove', function (e) { if (dragging) setCustom(hourFromEvent(e)); });
  ['pointerup', 'pointercancel'].forEach(function (ev) { sl.addEventListener(ev, function () { dragging = false; }); });
  sl.addEventListener('keydown', function (e) {
    var step = { ArrowLeft: -0.5, ArrowDown: -0.5, ArrowRight: 0.5, ArrowUp: 0.5, PageDown: -3, PageUp: 3 }[e.key];
    if (step !== undefined) setCustom(Math.max(0, Math.min(24, hour + step)));
    else if (e.key === 'Home') setCustom(0);
    else if (e.key === 'End') setCustom(24);
    else return;
    e.preventDefault(); e.stopPropagation();
  });

  function rep(s, n) { var a = []; while (n--) a.push(s); return a; }
  var GLYPHS = {
    D: ['#########..', '##########.', '###########'].concat(rep('#####.#####', 9), ['###########', '##########.', '#########..']),
    e: ['.#########.', '###########', '###########'].concat(rep('#####.#####', 3), rep('###########', 3), ['#####......'], rep('###########', 4), ['.#########.']),
    l: ['.####'].concat(rep('#####', 14)),
    u: rep('#####.#####', 11).concat(rep('###########', 3), ['.#########.']),
    x: rep('#####.#####', 5).concat(rep('.#########.', 5), rep('#####.#####', 5))
  };
  var logo;
  function makeLogo() {
    var word = ['D', 'e', 'l', 'u', 'x', 'e'], M = 2, rows = 15, cols = -1, offs = [];
    word.forEach(function (k) { offs.push(cols + 1); cols += GLYPHS[k][0].length + 1; });
    var cw = cols + M * 2, ch = rows + M * 2, ink = [], ol = [], y, x;
    for (y = 0; y < ch; y++) { ink.push([]); ol.push([]); for (x = 0; x < cw; x++) { ink[y].push(false); ol[y].push(false); } }
    word.forEach(function (k, i) {
      GLYPHS[k].forEach(function (row, yy) {
        for (var xx = 0; xx < row.length; xx++) if (row[xx] === '#') ink[yy + M][offs[i] + xx + M] = true;
      });
    });
    function I(a, b) { return b >= 0 && b < ch && a >= 0 && a < cw && ink[b][a]; }
    function O(a, b) { return b >= 0 && b < ch && a >= 0 && a < cw && ol[b][a]; }
    function near(f, a, b) {
      for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) if ((dx || dy) && f(a + dx, b + dy)) return true;
      return false;
    }
    for (y = 0; y < ch; y++) for (x = 0; x < cw; x++) ol[y][x] = !I(x, y) && near(I, x, y);
    var c = document.createElement('canvas'); c.width = cw; c.height = ch;
    var g = c.getContext('2d'), GOLD = '#f5ba18', CREAM = '#eafddb', DARK = '#523747';
    for (y = 0; y < ch; y++) for (x = 0; x < cw; x++) {
      var col = null;
      if (I(x, y)) col = I(x, y + 1) ? GOLD : CREAM;
      else if (ol[y][x]) col = (I(x, y - 1) && I(x - 1, y) && I(x + 1, y) && !I(x, y + 1)) ? CREAM : DARK;
      else if (near(O, x, y)) col = CREAM;
      if (col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); }
    }
    return c;
  }

  function start() {
    COLOURS.forEach(function (c) { strips.push(makeStrip(c.shift)); });
    logo = makeLogo();
    NIGHT = makeNight();
    updateMusicBtn();
    updateSfxBtn();
    window.focus(); document.body.tabIndex = -1; document.body.focus();
    buildSwatches();
    buildTimes();
    applyTime(true);
    setInterval(function () { if (timeMode === 'auto') applyTime(false); }, 30000);
    reset(true);
    ['pointerup', 'keydown'].forEach(function (ev) { document.addEventListener(ev, audioUnlock); });
    musicBtn.addEventListener('click', function (e) { sfx('click'); setMusic(!musicOn); e.currentTarget.blur(); });
    sfxBtn.addEventListener('click', function (e) { setSfx(!sfxOn); e.currentTarget.blur(); });
    gear.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    gear.addEventListener('click', function (e) { openSettings(true); e.currentTarget.blur(); });
    panel.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    panel.addEventListener('click', function (e) { if (e.target === panel) openSettings(false); });
    document.getElementById('done').addEventListener('click', function (e) { openSettings(false); e.currentTarget.blur(); });
    document.addEventListener('keydown', function (e) {
      if (e.code === 'Escape') { openSettings(false); return; }
      if (e.code === 'KeyM') { setMusic(!musicOn); return; }
      if (e.code === 'Space' || e.key === ' ' || e.code === 'ArrowUp' || e.key === 'ArrowUp') { e.preventDefault(); if (!e.repeat) flap(); }
    });
    document.body.addEventListener('pointerdown', function (e) { e.preventDefault(); window.focus(); flap(); });
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
